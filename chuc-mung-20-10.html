<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi Thanh Hân – Chúc mừng 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#7a1f45;--card:rgba(255,255,255,.66);--glow:rgba(255,110,150,.4);--veil:rgba(255,226,237,.62)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ffe6f0;--card:rgba(66,14,42,.6);--glow:rgba(255,150,190,.4);--veil:rgba(58,12,38,.62)}}
:root[data-theme="dark"]{--ink:#ffe6f0;--card:rgba(66,14,42,.6);--glow:rgba(255,150,190,.4);--veil:rgba(58,12,38,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:Quicksand,system-ui,sans-serif;color:var(--ink);background:#ffe0ea;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);font:600 24px 'Dancing Script',cursive;color:#b02a5a;text-shadow:0 1px 8px rgba(255,255,255,.8);pointer-events:none}
#tools{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;z-index:5}
#tools button,#tools label{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:20px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px var(--glow);color:var(--ink)}
#wish{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(92vw,470px);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:26px;padding:14px 20px 12px;text-align:center;box-shadow:0 12px 44px var(--glow);opacity:0;transition:opacity 1s}
#wish.on{opacity:1}
#wish .to{font:600 26px 'Dancing Script',cursive;color:#d6336c;margin-bottom:2px}
#txt{margin:0;font-size:17px;line-height:1.55;font-weight:600;min-height:5.4em;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .3em}
.w{display:inline-block;opacity:0;transform:translateY(10px) scale(.96);animation:in .7s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
#cnt{font-size:12px;opacity:.65;margin-top:6px}
#hint{font-size:13px;margin-top:2px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.97)}}
#intro{position:fixed;inset:0;z-index:10;background:var(--veil);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity 1s,visibility 1s}
#intro.off{opacity:0;visibility:hidden}
#intro .big{font-size:64px;animation:beat 1.3s ease-in-out infinite}
@keyframes beat{30%{transform:scale(1.18)}60%{transform:scale(1)}}
#intro h1{margin:0;font:600 46px 'Dancing Script',cursive;color:#d6336c}
#intro p{margin:0 0 12px;max-width:320px;line-height:1.5;font-weight:600}
#open{font:600 18px Quicksand,sans-serif;color:#fff;background:linear-gradient(135deg,#ff6b8b,#e8457a);border:0;border-radius:99px;padding:14px 34px;box-shadow:0 8px 28px rgba(232,69,122,.5);cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">Chúc mừng 20/10</div>
<div id="tools"><button id="mus" aria-label="Bật hoặc tắt nhạc">🔈</button><label title="Chọn bài hát của bạn">📁<input id="file" type="file" accept="audio/*" hidden></label></div>
<div id="wish"><div class="to">Gửi Thanh Hân 💗</div><p id="txt"></p><div id="hint">✨ chạm vào màn hình để nhận thêm lời chúc ✨</div><div id="cnt"></div></div>
<div id="intro"><div class="big">💌</div><h1>Gửi Thanh Hân</h1><p>Có một điều bất ngờ nhỏ nhân ngày 20/10, anh dành riêng cho em.</p><button id="open">Mở thiệp 💗</button></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
// ===== Sửa lời chúc ở đây =====
const WISHES=[
 "Chúc Thanh Hân 20/10 luôn khỏe mạnh, ăn ngon, ngủ ngon, ngày nào cũng tràn đầy năng lượng nhé!",
 "Chúc em lúc nào cũng xinh tươi, tóc đẹp, da đẹp, chụp tấm nào cũng ưng tấm đó 📸",
 "Mong em gặp toàn chuyện vui, đi đâu cũng thuận lợi, làm gì cũng suôn sẻ 🍀",
 "Chúc em cười nhiều hơn lo, vui nhiều hơn mệt, ngày nào cũng có chuyện hay để kể 😄",
 "Mong những điều em đang mong sẽ dần thành hiện thực, còn những chuyện không vui thì nhanh chóng qua đi.",
 "Chúc cô gái Thanh Hân luôn rạng rỡ, gặp người tốt, nhận tin vui và có thật nhiều dịp để tự thưởng cho mình 💗",
 "Tóm lại là: khỏe mạnh, xinh đẹp, may mắn, vui vẻ. Bốn điều này, em nhớ nhận đủ nhé!",
 "🎉 KHOAN! Lời chúc cuối cùng đây...",
 "Chúc em luôn vui theo cách của riêng mình. Còn món quà đặc biệt hôm nay là: một màn pháo hoa dành riêng cho em! Chạm thêm lần nữa để nhận bất ngờ cuối nhé ✨",
 "💥 CHÚC MỪNG 20/10, THANH HÂN! Hết lời chúc rồi, nhưng mong niềm vui của em còn kéo dài thật lâu. Chốt đơn: xinh đẹp + may mắn + thật nhiều tiếng cười! 💗🎉"
];
const PINKS=['#ff8fab','#ff6b8b','#ffb3c6','#ff9db8','#f4a0b5','#ffc2d1','#ff7a93','#e85d7f','#ffd1dc','#fb6f92','#ff5d7d','#f78fb3'];
const FL=['#ffffff','#ffe3ec','#ffc9d9','#ffb3c8','#fff0f5'],FP=['#ffb3c8','#ff9db8','#ffc9d9','#ffffff','#ff8fab'];
const PAL=[[255,214,229,255,244,247],[255,200,215,255,232,210],[238,196,238,255,228,240],[255,186,192,255,238,240],[255,206,226,222,236,255],[255,172,196,255,226,232]];
const cv=$('#c'),ctx=cv.getContext('2d');
let W,H,SC=1,tree,canopy=[],bok=[],cur=PAL[0].slice(),tgt=PAL[0],pulse=0,P=[],rip=[],idx=-1,opened=false;

function heart(x,y,s,r,col,a){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,s*.9);ctx.bezierCurveTo(-s*1.2,s*.1,-s*.7,-s*.9,0,-s*.3);ctx.bezierCurveTo(s*.7,-s*.9,s*1.2,s*.1,0,s*.9);ctx.fill();ctx.restore()}
function petal(l,w){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(w,-l*.5,0,-l);ctx.quadraticCurveTo(-w,-l*.5,0,0);ctx.fill()}
function flower(x,y,s,r,col,k,a){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.globalAlpha=a;ctx.fillStyle=col;
 if(k==0){for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);petal(s,s*.5)}ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(0,0,s*.16,0,7);ctx.fill()}
 else if(k==1){for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.beginPath();ctx.arc(0,-s*.5,s*.46,0,7);ctx.fill()}ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(0,0,s*.2,0,7);ctx.fill()}
 else{for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);petal(s,s*.38)}ctx.fillStyle='#fff0f5';for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);petal(s*.62,s*.3)}ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(0,0,s*.12,0,7);ctx.fill()}
 ctx.restore()}
function spark(x,y,s,r,col,a){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(0,0,s,0);ctx.quadraticCurveTo(0,0,0,s);ctx.quadraticCurveTo(0,0,-s,0);ctx.quadraticCurveTo(0,0,0,-s);ctx.fill();ctx.restore()}

function build(){
 SC=Math.max(.8,Math.min(W,H)/420);
 const cx=W/2,cy=H*.38,rx=Math.min(W*.42,H*.36),ry=H*.24,u=Math.max(11,Math.min(W,H)/30);
 tree={cx,cy,rx,ry,base:H*.95};
 const L=[[0,0,1,1],[-.55,.25,.55,.6],[.55,.25,.55,.6],[-.3,-.4,.5,.5],[.3,-.4,.5,.5]];
 canopy=[];
 for(let i=0;i<340;i++){const l=pick(L),a=rnd(0,6.283),r=Math.sqrt(Math.random()),fl=i%8==0;
  canopy.push({x:cx+(l[0]+Math.cos(a)*r*l[2])*rx,y:cy+(l[1]+Math.sin(a)*r*l[3])*ry,s:fl?u*rnd(.9,1.4):u*rnd(.55,1.15),r:rnd(-.5,.5),p:rnd(0,6.28),c:fl?pick(FL):pick(PINKS),k:fl?i%3:3,a:fl?1:rnd(.82,1)})}
 canopy.sort((a,b)=>a.y-b.y);
 bok=Array.from({length:16},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(10,40),v:rnd(.1,.4),p:rnd(0,6)}));
}
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);build()}
addEventListener('resize',size);size();

function drawTree(t){
 const{cx,cy,rx,ry,base}=tree,tw=Math.max(14,W*.045),topY=cy+ry*.6;
 ctx.globalAlpha=1;ctx.lineCap='round';ctx.strokeStyle='#a8606a';
 ctx.lineWidth=tw;ctx.beginPath();ctx.moveTo(cx,base);ctx.quadraticCurveTo(cx-W*.03,(base+topY)/2,cx,topY);ctx.stroke();
 ctx.lineWidth=tw*1.9;ctx.beginPath();ctx.moveTo(cx,base+6);ctx.lineTo(cx,base-H*.03);ctx.stroke();
 [[-.5,.1,.5],[.5,.05,.5],[-.25,-.25,.35],[.3,-.3,.35],[-.75,.3,.4],[.75,.3,.4]].forEach(b=>{
  ctx.lineWidth=tw*b[2];ctx.beginPath();ctx.moveTo(cx,topY);ctx.quadraticCurveTo(cx+b[0]*rx*.2,cy+ry*.3,cx+b[0]*rx+Math.sin(t*.7)*2,cy+b[1]*ry);ctx.stroke()});
 ctx.strokeStyle='rgba(255,210,215,.55)';ctx.lineWidth=tw*.22;ctx.beginPath();ctx.moveTo(cx+tw*.18,base-6);ctx.quadraticCurveTo(cx-W*.02,(base+topY)/2,cx+tw*.15,topY);ctx.stroke();
}
function mk(x,y,o){const k=pick([3,3,3,3,0,1,2,4]);P.length<420&&P.push(Object.assign({x,y,vx:0,vy:0,g:0,d:1,wob:0,sw:rnd(0,6),r:rnd(0,6),vr:rnd(-.05,.05),s:rnd(8,20)*SC,k,c:k==4?pick(['#fff3b0','#ffffff','#ffd6e0']):k<3?pick(FP):pick(PINKS),l:0,m:rnd(100,160)},o))}
const burst=(x,y,n)=>{for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(2,7);mk(x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.07,d:.985})}};
const fx=[
 (x,y)=>burst(x,y,40),
 ()=>{for(let i=0;i<70;i++)mk(rnd(0,W),rnd(-H*.4,-10),{vy:rnd(1.5,3.5),wob:rnd(.3,1),m:400})},
 ()=>{for(let i=0;i<46;i++)mk(rnd(0,W),H+20+rnd(0,H*.2),{vy:rnd(-2.6,-4.5),wob:rnd(.3,1.2),m:500,s:rnd(14,28)*SC})},
 (x,y)=>{for(let i=0;i<56;i++){const a=i/56*6.283;mk(x,y,{vx:Math.cos(a)*5,vy:Math.sin(a)*5,d:.97,vr:.08,m:130});if(i%2)mk(x,y,{vx:Math.cos(a)*2.6,vy:Math.sin(a)*2.6,d:.97,m:130})}},
 ()=>{for(let j=0;j<3;j++)setTimeout(()=>burst(rnd(W*.2,W*.8),rnd(H*.12,H*.42),30),j*280)}
];
function frame(ms){
 const t=ms/1000;
 for(let i=0;i<6;i++)cur[i]+=(tgt[i]-cur[i])*.03;
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${cur[0]|0},${cur[1]|0},${cur[2]|0})`);g.addColorStop(1,`rgb(${cur[3]|0},${cur[4]|0},${cur[5]|0})`);
 ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const{cx,cy,rx}=tree,rg=ctx.createRadialGradient(cx,cy,0,cx,cy,rx*1.4);rg.addColorStop(0,'rgba(255,255,255,.6)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 bok.forEach(b=>{b.y-=b.v;if(b.y<-50)b.y=H+50;ctx.globalAlpha=.16+.1*Math.sin(t+b.p);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x+Math.sin(t*.5+b.p)*14,b.y,b.r,0,7);ctx.fill()});
 ctx.globalAlpha=1;ctx.fillStyle='rgba(255,150,180,.45)';ctx.beginPath();ctx.ellipse(cx,H*1.02,W*.75,H*.1,0,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,190,208,.7)';ctx.beginPath();ctx.ellipse(cx-W*.25,H*1.04,W*.6,H*.08,0,0,7);ctx.fill();
 drawTree(t);
 const pz=1+pulse*.2;
 canopy.forEach(c=>{const x=c.x+Math.sin(t*.9+c.p)*2.5,y=c.y+Math.cos(t*.7+c.p)*1.5,r=c.r+Math.sin(t*1.1+c.p)*.12;c.k==3?heart(x,y,c.s*pz,r,c.c,c.a):flower(x,y,c.s*pz,r,c.c,c.k,1)});
 if(Math.random()<.09)mk(tree.cx+rnd(-tree.rx,tree.rx),tree.cy+rnd(-tree.ry*.2,tree.ry*.8),{k:pick([0,1,2,3,3]),vy:rnd(.4,1.1),vx:rnd(-.3,.3),wob:.6,m:500,s:rnd(6,11)*SC});
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.l++;p.vx*=p.d;p.vy*=p.d;p.vy+=p.g;p.x+=p.vx+Math.sin(p.l*.06+p.sw)*p.wob;p.y+=p.vy;p.r+=p.vr;
  if(p.l>p.m||p.y>H+80||p.y<-90||p.x<-90||p.x>W+90){P.splice(i,1);continue}
  const a=Math.max(0,Math.min(1,(p.m-p.l)/30,p.l/8+.2));
  p.k==3?heart(p.x,p.y,p.s,p.r,p.c,a):p.k==4?spark(p.x,p.y,p.s*.8,p.r,p.c,a):flower(p.x,p.y,p.s,p.r,p.c,p.k,a)}
 for(let i=rip.length-1;i>=0;i--){const q=rip[i];q.r+=6;if(q.r>260){rip.splice(i,1);continue}ctx.globalAlpha=.5*(1-q.r/260);ctx.strokeStyle='#ff6b8b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.stroke()}
 pulse*=.94;requestAnimationFrame(frame)}
requestAnimationFrame(frame);

function show(i){
 $('#txt').innerHTML=WISHES[i].split(' ').map((s,j)=>`<span class="w" style="animation-delay:${j*.05}s">${s}</span>`).join('');
 $('#cnt').textContent=`${i+1} / ${WISHES.length}`;$('#wish').classList.add('on')}
function tap(x,y){
  if(idx===WISHES.length-1){
    // Sau lời chúc cuối, mỗi lần chạm tạo một màn pháo hoa lớn để khép lại.
    for(let j=0;j<5;j++)setTimeout(()=>burst(rnd(W*.18,W*.82),rnd(H*.15,H*.58),65),j*220);
    for(let j=0;j<90;j++)mk(x,y,{vx:rnd(-7,7),vy:rnd(-8,3),g:.045,d:.985,m:220,s:rnd(10,24)*SC});
    rip.push({x,y,r:0});pulse=1;tgt=PAL[(idx+1)%PAL.length];chime();return;
  }
  idx++;
  show(idx);
  if(idx===WISHES.length-1){
    // Lần chạm cuối chuyển sang màn kết thúc với pháo hoa nhiều đợt.
    for(let j=0;j<5;j++)setTimeout(()=>burst(rnd(W*.18,W*.82),rnd(H*.15,H*.58),65),j*220);
  }else{fx[idx%5](x,y)}
  rip.push({x,y,r:0});tgt=PAL[idx%PAL.length];pulse=1;chime()
}
document.addEventListener('pointerdown',e=>{if(!opened||e.target.closest('button,label'))return;tap(e.clientX,e.clientY)});

// ===== Nhạc: hộp nhạc tự tạo bằng WebAudio, hoặc chọn bài hát từ máy =====
let ac,mg,playing=false,custom=null,step=0,nxt=0;
const M=[[48,52,55,60],[45,52,57,60],[41,48,53,57],[43,50,55,59]],
ML=[[76,0,72,0,74,0,72,0],[72,0,76,0,74,0,72,0],[69,0,72,0,77,0,76,0],[74,0,71,0,72,0,0,0]],AR=[0,1,2,3,2,1,2,1],hz=m=>440*2**((m-69)/12);
function tone(m,t,d,v,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=hz(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function sched(){while(nxt<ac.currentTime+.25){const bar=(step>>3)%4,i=step&7,mel=ML[bar][i];tone(M[bar][AR[i]]+12,nxt,1.1,.09,'triangle');if(mel)tone(mel,nxt,1.6,.12);if(i==0)tone(M[bar][0]-12,nxt,2.6,.12);nxt+=.42;step++}}
function chime(){if(playing&&!custom&&ac)tone(pick([84,86,88,91,93]),ac.currentTime,1.4,.07)}
function startMusic(){
 if(custom)custom.play().catch(()=>{});
 else{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();mg=ac.createGain();mg.gain.value=.55;const dl=ac.createDelay(),fb=ac.createGain();dl.delayTime.value=.33;fb.gain.value=.35;mg.connect(ac.destination);mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);nxt=ac.currentTime+.1;setInterval(sched,100)}ac.resume()}
 playing=true;$('#mus').textContent='🎶'}
function stopMusic(){custom?custom.pause():ac&&ac.suspend();playing=false;$('#mus').textContent='🔈'}
$('#mus').onclick=()=>playing?stopMusic():startMusic();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;ac&&ac.suspend();custom&&custom.pause();custom=new Audio(URL.createObjectURL(f));custom.loop=true;startMusic()};
$('#open').onclick=()=>{opened=true;startMusic();$('#intro').classList.add('off');setTimeout(()=>tap(W/2,H*.4),300)};
</script>
</body>
</html>
